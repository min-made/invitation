name: Deploy to GitHub Pages

# 배포 산출물 분리
#   저장소에는 작업 문서와 도구가 함께 있지만, 실제로 게시하는 것은
#   index.html · assets/ · robots.txt · .nojekyll 뿐입니다.
#   Pages 는 소스 브랜치를 그대로 서빙하므로, 이 워크플로 없이 배포하면
#   README.md 나 tools/*.py 까지 URL 로 열립니다.
#
# 사용 전 설정
#   저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔주세요.
#   (기본값인 "Deploy from a branch" 로 두면 이 워크플로가 무시됩니다.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 취소하지는 않습니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 게시할 파일만 dist/ 로 모으기
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -R assets dist/
          cp .nojekyll dist/ 2>/dev/null || true
          cp robots.txt dist/ 2>/dev/null || true

      - name: 제외 확인 (문서·도구가 섞이지 않았는지)
        run: |
          echo "── dist/ 최상위 ──"
          ls -A dist
          for f in README.md CUSTOMIZE.md references.md references-analysis.md tools .claude; do
            if [ -e "dist/$f" ]; then
              echo "::error::dist/$f 가 포함되었습니다. 게시 대상이 아닙니다."
              exit 1
            fi
          done
          echo "── 용량 ──"
          du -sh dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
