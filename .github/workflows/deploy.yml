name: Deploy to GitHub Pages

# 배포 산출물 분리
#   저장소에는 작업 문서와 도구가 함께 있지만, 실제로 게시하는 것은
#   index.html · assets/ · robots.txt · .nojekyll 뿐입니다.
#   Pages 는 소스 브랜치를 그대로 서빙하므로, 이 워크플로 없이 배포하면
#   README.md 나 tools/*.py 까지 URL 로 열립니다.
#
# 사용 전 설정
#   저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔주세요.
#   (기본값인 "Deploy from a branch" 로 두면 이 워크플로가 무시됩니다.)

# ⚠ 자동 배포를 껐습니다 (2026-08-20).
#   push 만으로는 배포되지 않고, Actions 탭에서 "Run workflow" 를
#   직접 눌러야 실행됩니다. 실명·계좌를 채우는 도중 실수로 게시되는
#   것을 막기 위한 조치입니다.
#
#   다시 자동 배포로 돌리려면 아래 주석을 해제하세요.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 취소하지는 않습니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 빌드 도구 설치
        run: pip install --quiet pyyaml fonttools brotli

      - name: config 복원 후 index.html 생성
        # 실제 이름·연락처·계좌는 저장소에 없습니다.
        # Actions Secret 에서 받아 여기서만 사용하고, 로그에 남기지 않습니다.
        #   Settings → Secrets and variables → Actions → WEDDING_CONFIG
        env:
          WEDDING_CONFIG: ${{ secrets.WEDDING_CONFIG }}
        run: |
          if [ -z "$WEDDING_CONFIG" ]; then
            echo "::error::WEDDING_CONFIG secret 이 비어 있습니다. 배포를 중단합니다."
            exit 1
          fi
          printf '%s' "$WEDDING_CONFIG" > config.yaml
          python tools/build.py --config config.yaml
          rm -f config.yaml

      - name: 폰트 서브셋 재생성
        # Pretendard 는 본문에 실제로 쓰인 글자만 담습니다.
        # 실명이 들어간 뒤 다시 만들지 않으면 그 글자만 시스템 폰트로 보입니다.
        run: python tools/fetch_fonts.py


      - name: 게시할 파일만 dist/ 로 모으기
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -R assets dist/
          cp .nojekyll dist/ 2>/dev/null || true
          cp robots.txt dist/ 2>/dev/null || true
          cp sw.js dist/ 2>/dev/null || true      # 오프라인 캐시 (사진 제외)

      - name: 서비스 워커 캐시 버전 갱신
        # sw.js 의 CACHE 이름을 커밋 해시로 바꿉니다.
        # 이걸 안 하면 하객 단말이 예전에 캐시한 화면을 계속 봅니다.
        # 원본 sw.js 는 건드리지 않고 dist/ 사본만 고칩니다.
        run: |
          if [ -f dist/sw.js ]; then
            sed -i "s/const CACHE = '[^']*'/const CACHE = 'invi-${GITHUB_SHA::7}'/" dist/sw.js
            grep -n "const CACHE" dist/sw.js
            grep -q "const CACHE = 'invi-${GITHUB_SHA::7}'" dist/sw.js \
              || { echo "::error::sw.js 캐시 버전 치환 실패"; exit 1; }
          fi

      - name: 제외 확인 (문서·도구가 섞이지 않았는지)
        run: |
          echo "── dist/ 최상위 ──"
          ls -A dist
          for f in index.html assets/wedding.ics assets/font/pretendard-subset.woff2; do
            [ -s "dist/$f" ] || { echo "::error::생성물 누락: $f"; exit 1; }
          done
          if grep -q '{{' dist/index.html; then
            echo "::error::index.html 에 치환되지 않은 토큰이 남아 있습니다"
            exit 1
          fi
          for f in README.md CUSTOMIZE.md references.md references-analysis.md tools .claude; do
            if [ -e "dist/$f" ]; then
              echo "::error::dist/$f 가 포함되었습니다. 게시 대상이 아닙니다."
              exit 1
            fi
          done
          echo "── 용량 ──"
          du -sh dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
